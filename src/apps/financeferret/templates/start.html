<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Start PocketQuest</title>
</head>
<body>
    <main>
        <h1>Start your quest</h1>

        <form method="POST" action="/start">
            <label for="player_name">What is your name?</label>
            <input type="text" id="player_name" name="player_name" required>

            <button type="submit">Begin</button>
        </form>
    </main>
</body>
</html>
